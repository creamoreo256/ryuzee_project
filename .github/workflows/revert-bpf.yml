name: Revert broken BPF backport

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit hash to revert (contoh: c5bd15d1b747)"
        required: true

jobs:
  revert:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revert commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git revert ${{ github.event.inputs.commit }} --no-edit

      - name: Push revert
        run: |
          git push
