name: Apply SAFE BPF patches (surya 4.14)

on:
  workflow_dispatch:

jobs:
  bpf:
    runs-on: ubuntu-22.04

    steps:
      # ============================
      # Checkout TARGET kernel
      # ============================
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================
      # Clone crDroid BPF source
      # ============================
      - name: Clone crDroid BPF source
        run: |
          git clone https://github.com/crdroidandroid/android_kernel_xiaomi_surya crdroid
          cd crdroid
          git checkout 16.0-bpf

      # ============================
      # Collect SAFE BPF patches ONLY
      # ============================
      - name: Collect SAFE BPF commits
        run: |
          mkdir -p patches
          cd crdroid

          git log --reverse --pretty=format:%H -- \
            kernel/bpf \
            kernel/bpf/syscall.c \
            kernel/bpf/map* \
            kernel/bpf/helpers* \
            include/uapi/linux/bpf.h \
          | grep -Ei "bpf|ebpf|syscall|map|helper" \
          | grep -Eiv "zext|verifier|core.c|verifier.c|btf|trace|debug|selftest|perf|x86|arm64|arch" \
          > /tmp/bpf_list.txt

          echo "Selected commits:"
          cat /tmp/bpf_list.txt

          while read c; do
            git format-patch -1 "$c" -o ../patches
          done < /tmp/bpf_list.txt

      # ============================
      # Apply patches SAFELY
      # ============================
      - name: Apply patches
        run: |
          ls -lah patches || exit 0
          for p in patches/*.patch; do
            echo "Applying $p"
            git apply --check "$p" || continue
            git apply "$p"
          done

      # ============================
      # Ensure surya_defconfig BPF
      # ============================
      - name: Ensure BPF config (surya)
        run: |
          DEFCONFIG=arch/arm64/configs/surya_defconfig

          grep -q CONFIG_BPF=y $DEFCONFIG || echo "CONFIG_BPF=y" >> $DEFCONFIG
          grep -q CONFIG_BPF_SYSCALL=y $DEFCONFIG || echo "CONFIG_BPF_SYSCALL=y" >> $DEFCONFIG
          grep -q CONFIG_NETFILTER_XT_MATCH_BPF=y $DEFCONFIG || echo "CONFIG_NETFILTER_XT_MATCH_BPF=y" >> $DEFCONFIG

      # ============================
      # Commit & push
      # ============================
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git status
          git commit -am "kernel: safe BPF backport for Android 15/16 (surya)" || echo "Nothing to commit"
          git push
