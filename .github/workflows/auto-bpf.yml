name: Apply SAFE BPF patches (A16)

on:
  workflow_dispatch:

jobs:
  bpf:
    runs-on: ubuntu-22.04

    steps:
      # ============================
      # Checkout TARGET kernel
      # ============================
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false   # 🔥 FIX KernelSU error

      # ============================
      # Clone crDroid BPF source
      # ============================
      - name: Clone crDroid BPF source
        run: |
          git clone https://github.com/crdroidandroid/android_kernel_xiaomi_surya crdroid
          cd crdroid
          git checkout 16.0-bpf

      # ============================
      # Collect REALLY SAFE BPF commits
      # ============================
      - name: Collect SAFE BPF commits
        run: |
          mkdir -p patches
          cd crdroid

          git log --reverse --pretty=format:%H -- \
            kernel/bpf \
            kernel/bpf/syscall.c \
            kernel/bpf/verifier.c \
            include/uapi/linux/bpf.h \
          > /tmp/bpf_raw.txt

          > /tmp/bpf_list.txt
          while read c; do
            files=$(git show --name-only --pretty=format: "$c")
            echo "$files" | grep -qE '^(kernel/bpf|include/uapi/linux/bpf.h)' || continue
            echo "$files" | grep -qE '(arch/|drivers/|perf/|trace/|selftests/|btf)' && continue
            echo "$c" >> /tmp/bpf_list.txt
          done < /tmp/bpf_raw.txt

          echo "SAFE BPF commits:"
          wc -l /tmp/bpf_list.txt
          cat /tmp/bpf_list.txt

          while read c; do
            git format-patch -1 "$c" -o ../patches
          done < /tmp/bpf_list.txt

      # ============================
      # Apply patches safely
      # ============================
      - name: Apply patches
        run: |
          ls -lah patches || exit 0
          for p in patches/*.patch; do
            echo "Applying $p"
            git apply --check "$p" || continue
            git apply "$p"
          done

      # ============================
      # Ensure surya_defconfig (SAFE)
      # ============================
      - name: Ensure BPF config (surya)
        run: |
          DEFCONFIG=arch/arm64/configs/surya_defconfig

          grep -q CONFIG_BPF=y $DEFCONFIG || echo "CONFIG_BPF=y" >> $DEFCONFIG
          grep -q CONFIG_BPF_SYSCALL=y $DEFCONFIG || echo "CONFIG_BPF_SYSCALL=y" >> $DEFCONFIG
          grep -q CONFIG_BPF_JIT=y $DEFCONFIG || echo "CONFIG_BPF_JIT=y" >> $DEFCONFIG
          grep -q CONFIG_HAVE_EBPF_JIT=y $DEFCONFIG || echo "CONFIG_HAVE_EBPF_JIT=y" >> $DEFCONFIG

      # ============================
      # Commit & push
      # ============================
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git status
          git commit -am "kernel: backport SAFE eBPF support for A15/A16 (surya)" || echo "Nothing to commit"
          git push
