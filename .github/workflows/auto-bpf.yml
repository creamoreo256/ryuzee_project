name: Apply SAFE BPF patches (surya 4.14)

on:
  workflow_dispatch:

jobs:
  bpf:
    runs-on: ubuntu-22.04

    steps:
      # ============================
      # Checkout TARGET kernel
      # ============================
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      # ============================
      # Clone crDroid source (reference)
      # ============================
      - name: Clone crDroid kernel source
        run: |
          git clone https://github.com/crdroidandroid/android_kernel_xiaomi_surya crdroid
          cd crdroid
          git checkout 16.0

      # ============================
      # Collect ONLY SAFE BPF commits (4.14-REALISTIC)
      # ============================
      - name: Collect SAFE BPF commits
        run: |
          set +e
          mkdir -p patches
          cd crdroid

          # HANYA syscall & UAPI (AMAN)
          git log --reverse --pretty=format:%H -- \
            kernel/sys.c \
            include/uapi/linux/bpf.h \
          > /tmp/bpf_raw.txt

          > /tmp/bpf_list.txt
          while read c; do
            files=$(git show --name-only --pretty=format: "$c")

            # harus hanya syscall / uapi
            echo "$files" | grep -qE '^(kernel/sys.c|include/uapi/linux/bpf.h)' || continue

            # buang fitur modern
            echo "$files" | grep -qE '(verifier|core.c|zext|btf|trace|perf|selftest|arch/)' && continue

            echo "$c" >> /tmp/bpf_list.txt
          done < /tmp/bpf_raw.txt

          echo "SAFE BPF commits selected:"
          cat /tmp/bpf_list.txt || true

          if [ ! -s /tmp/bpf_list.txt ]; then
            echo "No SAFE BPF commits for kernel 4.14 — expected."
            exit 0
          fi

          while read c; do
            git format-patch -1 "$c" -o ../patches
          done < /tmp/bpf_list.txt

      # ============================
      # Apply patches SAFELY
      # ============================
      - name: Apply patches
        run: |
          ls -lah patches || exit 0
          for p in patches/*.patch; do
            echo "Applying $p"
            git apply --check "$p" || continue
            git apply "$p"
          done

      # ============================
      # Ensure surya_defconfig (SAFE)
      # ============================
      - name: Ensure BPF config (surya)
        run: |
          DEFCONFIG=arch/arm64/configs/surya_defconfig

          grep -q CONFIG_BPF=y $DEFCONFIG || echo "CONFIG_BPF=y" >> $DEFCONFIG
          grep -q CONFIG_BPF_SYSCALL=y $DEFCONFIG || echo "CONFIG_BPF_SYSCALL=y" >> $DEFCONFIG
          grep -q CONFIG_BPF_JIT=y $DEFCONFIG || echo "CONFIG_BPF_JIT=y" >> $DEFCONFIG

      # ============================
      # Commit & push
      # ============================
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git status
          git commit -am "kernel: enable SAFE BPF syscall & uapi for 4.14 (surya)" || echo "Nothing to commit"
          git push
