name: Build Kernel

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install build deps
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison build-essential ccache flex \
          libssl-dev libelf-dev lld git wget unzip

    - name: Get Clang
      run: |
        git clone --depth=1 https://github.com/llvm/llvm-project clang

    - name: Build kernel
      run: |
        chmod +x build.sh
        ./build.sh

    # ==============================
    # Upload kernel output
    # ==============================
    - name: Upload kernel result
      uses: actions/upload-artifact@v4
      with:
        name: kernel-out
        path: out/arch/arm64/boot/

    # ==============================
    # Upload defconfig backup
    # ==============================
    - name: Upload defconfig backup
      uses: actions/upload-artifact@v4
      with:
        name: defconfig-backup
        path: defconfig_backup/
