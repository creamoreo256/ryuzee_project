name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install build deps
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison build-essential ccache flex \
          libssl-dev libelf-dev lld git wget unzip zip

    # ==============================
    # Cache Clang (ANTI DOWNLOAD ULANG)
    # ==============================
    - name: Cache Proton Clang
      uses: actions/cache@v4
      with:
        path: clang
        key: ${{ runner.os }}-proton-clang

    # ==============================
    # Get Clang (Android prebuilt)
    # ==============================
    - name: Get Clang (Android prebuilt)
      run: |
        if [ ! -d clang ]; then
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang
        else
          echo "Using cached Proton Clang"
        fi

    # ==============================
    # Build Kernel
    # ==============================
    - name: Build kernel
      run: |
        chmod +x build.sh
        ./build.sh

    # ==============================
    # Pack ZIP (Image.gz)
    # ==============================
    - name: Pack kernel zip
      run: |
        KERNEL_IMAGE=out/arch/arm64/boot/Image.gz
        ZIP_NAME="${ZIP_NAME:-SuryaKernel-${GITHUB_REF_NAME}}.zip"

        # safety check
        [ -f ${KERNEL_IMAGE} ] || { echo "Kernel image not found!"; exit 1; }

        cp ${KERNEL_IMAGE} AnyKernel3/Image.gz
        cd AnyKernel3
        zip -r9 ../${ZIP_NAME} *
        cd ..

        echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

    # ==============================
    # Generate Changelog (TAG ONLY)
    # ==============================
    - name: Generate changelog
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        echo "## Changelog (${GITHUB_REF_NAME})" > CHANGELOG.md
        echo "" >> CHANGELOG.md
        git log --pretty=format:"- %s (%an)" \
          $(git describe --tags --abbrev=0 HEAD^)..HEAD >> CHANGELOG.md

    # ==============================
    # Upload Artifacts
    # ==============================
    - name: Upload kernel zip
      uses: actions/upload-artifact@v4
      with:
        name: kernel-zip
        path: "*.zip"

    - name: Upload changelog
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: changelog
        path: CHANGELOG.md

    # ==============================
    # GitHub Release (TAG ONLY)
    # ==============================
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          *.zip
          CHANGELOG.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
