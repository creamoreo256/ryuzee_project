name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install build deps
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison build-essential ccache flex \
          libssl-dev libelf-dev lld git wget unzip zip

    # ==============================
    # Cache Proton Clang
    # ==============================
    - name: Cache Proton Clang
      uses: actions/cache@v4
      with:
        path: clang
        key: ${{ runner.os }}-proton-clang

    - name: Get Clang
      run: |
        if [ ! -d clang ]; then
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang
        else
          echo "Using cached Proton Clang"
        fi

    # ==============================
    # Build Kernel
    # ==============================
    - name: Build kernel
      run: |
        chmod +x build.sh
        ./build.sh

    # ==============================
    # Pack AnyKernel ZIP (FULL)
    # ==============================
    - name: Pack kernel zip
      run: |
        OUT=out/arch/arm64/boot
        AK=AnyKernel3

        cp ${OUT}/Image.gz ${AK}/Image.gz
        [ -f ${OUT}/dtb.img ] && cp ${OUT}/dtb.img ${AK}/dtb.img
        [ -f ${OUT}/dtbo.img ] && cp ${OUT}/dtbo.img ${AK}/dtbo.img

        ZIP_NAME="${ZIP_NAME:-UranusKernel-${GITHUB_REF_NAME}}.zip"
        cd ${AK}
        zip -r9 ../${ZIP_NAME} *
        cd ..

        echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

    # ==============================
    # Upload Artifact
    # ==============================
    - name: Upload kernel zip
      uses: actions/upload-artifact@v4
      with:
        name: kernel-zip
        path: "*.zip"

    # ==============================
    # GitHub Release (TAG ONLY)
    # ==============================
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: "*.zip"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
